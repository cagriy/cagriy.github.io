title: "Phase Shift"
subtitle: "AI, Tech, Consciousness, Ethics."
description: "AI, Tech, Consciousness, Ethics. It may be a bit of each, maybe none."
url: "https://cagriy.github.io"
baseurl: ""

author:
  name: "Cagri"
  github: "cagriy"

remote_theme: "mmistakes/minimal-mistakes@master"
minimal_mistakes_skin: "default"

search: true
search_full_content: true

paginate: 10
paginate_path: /page:num/

permalink: /:year/:month/:title/

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-include-cache
  - jekyll-remote-theme

include:
  - _pages

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
      read_time: true
      share: true
      related: true
  - scope:
      path: "_pages"
      type: pages
    values:
      layout: single
      author_profile: true

category_archive:
  type: liquid
  path: /categories/

tag_archive:
  type: liquid
  path: /tags/
